[platformio]
src_dir = .

[env:swervolf_nexys]
platform = chipsalliance
board = swervolf_nexys
framework = wd-riscv-sdk

build_src_filter =
    +<main.cc>
    +<veerwolf_syscalls.cc>
    +<tflm/tensorflow/**/*.cc>
    +<tflm/third_party/**/*.cc>
    -<tflm/tensorflow/**/*_test.cc>
    -<tflm/third_party/**/*_test.cc>

build_flags =
    -O3
    -std=gnu++17
    -fno-rtti
    -fno-exceptions
    -fno-threadsafe-statics
    -lm
    -D MNIST_VEERWOLF
    -D TF_LITE_STATIC_MEMORY
    -D TF_LITE_USE_GLOBAL_MAX
    -D TF_LITE_USE_GLOBAL_MIN
    -D TF_LITE_USE_GLOBAL_CMATH_FUNCTIONS
    -I .
    -I tflm
    -I tflm/signal
    -I tflm/third_party/flatbuffers/include
    -I tflm/third_party/kissfft

board_build.bitstream_file = ${platformio.packages_dir}/framework-wd-riscv-sdk/board/nexys_a7_eh1/swervolf_eh1.bit
